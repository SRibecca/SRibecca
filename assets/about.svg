  <text x="28" y="162"><tspan class="k">intereses </tspan><tspan class="p">: [ </tspan><tspan class="l">Backend</tspan><tspan class="p">, </tspan><tspan class="l">Arquitectura de software</tspan><tspan class="p">, </tspan><tspan class="l">Análisis de datos</tspan><tspan class="p">, </tspan><tspan class="l">Emulación</tspan><tspan class="p"> ]</tspan></text>
  <text x="28" y="192"><tspan class="k">idiomas   </tspan><tspan class="p">: [ </tspan><tspan class="l">Español (nativo)</tspan><tspan class="p">, </tspan><tspan class="l">Inglés (avanzado)</tspan><tspan class="p"> ]</tspan></text>
