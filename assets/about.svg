  <circle cx="22" cy="17" r="6" fill="#a32f1a" />
  <circle cx="42" cy="17" r="6" fill="#e48e3e" />
  <circle cx="62" cy="17" r="6" fill="#a8611f" />
  <text x="450" y="22" text-anchor="middle" class="t">sobre-mi.yaml</text>

  <text x="28" y="72"><tspan class="k">nombre    </tspan><tspan class="p">: </tspan><tspan class="v">Santiago Ribecca</tspan></text>
