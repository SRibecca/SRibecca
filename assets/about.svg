<svg xml:space="preserve" xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250">
  <!-- Tarjeta "Sobre mí" estilo terminal con la paleta Akaito -->
  <style>
    text { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; font-size: 16px; }
